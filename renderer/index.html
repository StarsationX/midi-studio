<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:; frame-src 'self';" />
  <title>MIDI Studio</title>
  <link rel="stylesheet" href="./shared/tokens.css" />
  <link rel="stylesheet" href="./shell/shell.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img class="brand-logo" src="./shared/logo.png" alt="MIDI Studio" />
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab is-active" data-tab="forge">Midi Forge</button>
      <button class="tab" data-tab="player">Midi Player</button>
      <button class="tab" data-tab="review">Midi Editor</button>
      <button class="tab" data-tab="audition">Self Midi</button>
    </nav>
    <div class="topbar-right">
      <button class="iconbtn" id="settings-btn" title="Settings & About" aria-label="Settings and About">⚙</button>
      <button class="version-badge" id="version-badge" title="Check for updates">v—</button>
    </div>
  </header>

  <div class="modal-scrim" id="settings-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="modal-head">
        <h2 id="settings-title">Settings &amp; About</h2>
        <button class="iconbtn" id="settings-close" aria-label="Close">✕</button>
      </div>
      <div class="modal-body">
        <div class="srow"><span class="skey">Version</span><span class="sval mono" id="s-version">—</span></div>
        <div class="srow"><span class="skey">Midi-Forge</span><span class="sval" id="s-forge">checking…</span></div>
        <div class="srow storage-row">
          <span class="skey">Forge storage</span>
          <div class="storage-control">
            <span class="storage-path mono" id="s-forgedir">—</span>
            <div class="storage-actions">
              <button class="btn" id="s-changeforge">Change</button>
              <button class="btn btn-ghost" id="s-resetforge" hidden>Default</button>
              <button class="btn btn-ghost" id="s-openforge">Open folder</button>
            </div>
          </div>
        </div>
        <div class="srow">
          <span class="skey">Theme</span>
          <select class="sval" id="s-theme">
            <option value="lime">Lime (default)</option>
            <option value="cyan">Cyan</option>
            <option value="indigo">Indigo</option>
            <option value="magenta">Magenta</option>
            <option value="amber">Amber</option>
          </select>
        </div>
        <div class="srow">
          <span class="skey">Custom color</span>
          <input type="color" id="s-accent" value="#b8e62e" title="Pick any accent color" />
        </div>
        <div class="srow">
          <span class="skey">On launch</span>
          <label class="check"><input type="checkbox" id="s-autoupdate" checked /> Check for updates automatically</label>
        </div>
        <div class="srow">
          <span class="skey">Resource limit</span>
          <label class="check"><input type="checkbox" id="s-perf" /> Easy on the GPU/CPU (slower visuals, smaller Forge batches)</label>
        </div>
        <div class="modal-actions">
          <button class="btn" id="s-recheck">Re-check updates</button>
          <button class="btn btn-ghost" id="s-clean">Clean reinstall…</button>
        </div>
        <div class="srow"><span class="skey">Project</span><a class="link" id="s-repo" href="#">github.com/StarsationX/midi-studio</a></div>
      </div>
    </div>
  </div>

  <div class="update-banner" id="update-banner" hidden>
    <span class="ub-icon">⬆</span>
    <div class="ub-text">
      <div class="ub-title" id="ub-title">Update available</div>
      <div class="ub-sub" id="ub-sub"></div>
      <div class="ub-prog" id="ub-prog" hidden><div class="ub-prog-fill" id="ub-prog-fill"></div></div>
    </div>
    <button class="btn btn-primary" id="ub-apply">Update &amp; restart</button>
    <button class="btn btn-ghost" id="ub-dismiss" title="Dismiss">✕</button>
  </div>

  <main class="stage">
    <iframe class="tabframe is-active" id="frame-forge"  data-tab="forge"  src="./forge/index.html"  title="Midi Forge"></iframe>
    <iframe class="tabframe"           id="frame-player" data-tab="player" data-src="./player/index.html" title="Midi Player"></iframe>
    <iframe class="tabframe"           id="frame-review" data-tab="review" data-src="./review/index.html" title="Midi Editor"></iframe>
    <iframe class="tabframe"           id="frame-audition" data-tab="audition" data-src="./audition/index.html" title="Self Midi"></iframe>
  </main>

  <script src="./shell/shell.js"></script>
</body>
</html>
