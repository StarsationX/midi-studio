[package]
name = "midi-player"
version = "0.1.0"
edition = "2021"
description = "MIDI Studio player engine: NDJSON-over-stdio drop-in for python-engine/ipc_main.py"
license = "MIT"

[lib]
name = "midi_player"
path = "src/lib.rs"

[[bin]]
name = "midi-player"
path = "src/main.rs"

[dependencies]
midly = { version = "0.5", default-features = false, features = ["std", "alloc"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = "2"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
