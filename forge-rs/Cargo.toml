[package]
name = "forge-rs"
version = "0.1.0"
edition = "2021"
description = "MIDI Studio Forge without Python: BS-Roformer separation + Transkun v2 transcription on ONNX Runtime"
license = "MIT"
publish = false

[lib]
name = "forge_rs"
path = "src/lib.rs"

[[bin]]
name = "forge-rs"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22", "cuda"] }
rustfft = "6.4"
symphonia = { version = "0.5.4", default-features = false, features = ["wav", "pcm", "flac", "mp3", "ogg", "vorbis", "aac", "isomp4", "alac", "aiff"] }
midly = "0.5.3"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
libm = "0.2"
realfft = "3"
rayon = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
] }

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = 3
debug = 1

[profile.test]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
