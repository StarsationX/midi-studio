name: Release

# Build the Windows portable + NSIS installer and publish them (with checksums)
# to a GitHub Release whenever a v* tag is pushed.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install JS deps
        run: npm ci

      - name: Run unit tests
        run: npm test

      # Builds the light bundled Python (build-portable.bat) then the portable
      # exe + NSIS installer, and writes dist/SHA256SUMS.txt.
      - name: Build portable + installer
        run: |
          npm run build:portable
          npm run build:nsis

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: midi-studio-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
