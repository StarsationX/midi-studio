name: Exercise the published Windows upgrade path
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing installer release tag to diagnose (does not publish)
        required: true
        type: string
      sha256:
        description: Expected installer digest
        required: true
        type: string
  workflow_call:
    inputs:
      sha256:
        required: true
        type: string
permissions:
  contents: write # draft fetch only; no token in the installer step
jobs:
  upgrade:
    runs-on: windows-2022
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scope: [currentuser, allusers]
    env:
      GH_REPO: ${{ github.repository }}
      INSTALL_SCOPE: ${{ matrix.scope }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      NEXT_DIGEST: ${{ inputs.sha256 }}
    steps:
      - name: Verify both installers before executing either on this disposable runner
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:NEXT_DIGEST -notmatch '^[a-fA-F0-9]{64}$') { throw 'Expected a release tag and SHA-256' }
          Set-Location $env:RUNNER_TEMP
          $next = $env:RELEASE_TAG.Substring(1)
          gh release download v3.0.1 -p MIDI-Studio-3.0.1-Setup.exe
          if ($LASTEXITCODE) { throw 'Unable to fetch the public 3.0.1 installer' }
          gh release download $env:RELEASE_TAG -p "MIDI-Studio-$next-Setup.exe"
          if ($LASTEXITCODE) { throw 'Unable to fetch the candidate installer' }
          if ((Get-FileHash MIDI-Studio-3.0.1-Setup.exe).Hash -ne 'd78af42b31dc5edda6f3c7495beefda520a371b16988555868a8c256fcf02654') { throw 'Unexpected 3.0.1 installer' }
          if ((Get-FileHash "MIDI-Studio-$next-Setup.exe").Hash -ne $env:NEXT_DIGEST) { throw 'Unexpected candidate installer' }
      - name: Upgrade a real 3.0.1 install and keep application data
        shell: pwsh
        run: |
          Set-Location $env:RUNNER_TEMP
          $app = Join-Path $env:RUNNER_TEMP 'custom-install'
          $forge = Join-Path $env:RUNNER_TEMP 'custom-forge'
          $reg = 'HKCU:\Software\StarsationX\MIDI Studio'
          $old = Start-Process .\MIDI-Studio-3.0.1-Setup.exe -ArgumentList '/S',"/$env:INSTALL_SCOPE","/D=$app" -Wait -PassThru
          if ($old.ExitCode -or !(Test-Path "$app\resources\app.asar")) { throw "3.0.1 install failed: $($old.ExitCode)" }
          Get-FileHash "$app\Uninstall MIDI Studio.exe" | Format-List
          foreach ($h in 'HKCU:','HKLM:') {
            Get-ItemProperty "$h\Software\ab5bc8e7-f120-5de1-b7c5-f5b41892fd91","$h\Software\Microsoft\Windows\CurrentVersion\Uninstall\ab5bc8e7-f120-5de1-b7c5-f5b41892fd91" -ErrorAction SilentlyContinue | Select-Object InstallLocation,DisplayVersion,UninstallString | Format-List
            Get-ItemProperty "$h\Software\WOW6432Node\Microsoft\EdgeUpdate\Clients\*","$h\Software\Microsoft\EdgeUpdate\Clients\*" -ErrorAction SilentlyContinue | Select-Object name,pv | Format-Table
          }
          New-Item $reg -Force | Out-Null
          New-ItemProperty $reg ForgeStorageDir -Value $forge -Force | Out-Null
          $prefs = "$env:APPDATA\midi-studio\midi-studio-settings.json"
          New-Item (Split-Path $prefs),$forge -ItemType Directory -Force | Out-Null
          @{paths=@{forgeEnvDir=$forge};ui=@{autoCheckUpdates=$false;lastTab='review'}} | ConvertTo-Json | Set-Content $prefs
          $saved = (Get-FileHash $prefs).Hash
          $next = $env:RELEASE_TAG.Substring(1)
          $updated = Start-Process ".\MIDI-Studio-$next-Setup.exe" -ArgumentList '/S',"/$env:INSTALL_SCOPE","/D=$app" -Wait -PassThru
          if ($updated.ExitCode -or !(Test-Path "$app\forge-rs.exe") -or (Test-Path "$app\resources\app.asar")) {
            $code = $updated.ExitCode
            # The same passive wizard exposes the reason silent mode suppresses.
            Add-Type -AssemblyName UIAutomationClient
            $p = Start-Process ".\MIDI-Studio-$next-Setup.exe" -ArgumentList '/P',"/$env:INSTALL_SCOPE","/D=$app" -PassThru
            $seen = @{}
            $condition = [Windows.Automation.PropertyCondition]::new([Windows.Automation.AutomationElement]::ProcessIdProperty,$p.Id)
            for ($i=0; $i -lt 60 -and !$p.HasExited; $i++) {
              foreach ($win in [Windows.Automation.AutomationElement]::RootElement.FindAll('Children',$condition)) {
                foreach ($el in $win.FindAll('Descendants',[Windows.Automation.Condition]::TrueCondition)) {
                  $msg=$el.Current.Name
                  if ($msg -and !$seen.ContainsKey($msg)) { $seen[$msg]=$true; Write-Output "Setup: $msg" }
                }
              }
              Start-Sleep -Seconds 1
            }
            if (!$p.HasExited) { $p.Kill() }
            throw "3.0.1 cutover failed: $code. Native binary present: $(Test-Path "$app\forge-rs.exe"); Electron still present: $(Test-Path "$app\resources\app.asar")"
          }
          if ((Get-Item "$app\MIDI Studio.exe").VersionInfo.ProductVersion -notmatch ('^'+[regex]::Escape($next)+'(?:\.|$)')) { throw 'Wrong desktop version installed' }
          if ((Get-FileHash $prefs).Hash -ne $saved -or (Get-ItemPropertyValue $reg ForgeStorageDir) -ne $forge) { throw 'Upgrade changed settings or Forge storage' }
          if (Test-Path "$app\assets\bs_rofo_sw\bsrofo_sw_body.onnx") { throw 'Installer supplied restricted weights' }
          $hive = if ($env:INSTALL_SCOPE -eq 'allusers') { 'HKLM:' } else { 'HKCU:' }
          if (Test-Path "$hive\Software\Microsoft\Windows\CurrentVersion\Uninstall\ab5bc8e7-f120-5de1-b7c5-f5b41892fd91") { throw 'Old app still registered' }
          Write-Output "3.0.1 -> ${next}: custom paths and settings preserved; native app installed."

  fresh-core:
    runs-on: windows-2022
    timeout-minutes: 8
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Fetch and authenticate candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DIGEST: ${{ inputs.sha256 }}
        run: |
          cd $env:RUNNER_TEMP
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Unexpected tag' }
          $next = 'MIDI-Studio-' + $env:RELEASE_TAG.Substring(1) + '-Setup.exe'
          gh release download $env:RELEASE_TAG -p $next
          if ($LASTEXITCODE -or (Get-FileHash $next).Hash -ne $env:NEXT_DIGEST) { throw 'Invalid core installer' }
      - name: Install desktop without opting into any model or GPU downloads
        shell: pwsh
        run: |
          cd $env:RUNNER_TEMP
          $ver = $env:RELEASE_TAG.Substring(1)
          $app = "$env:RUNNER_TEMP\Clean Studio"
          $store = "$env:LOCALAPPDATA\midi-studio\forge-env"
          $p = Start-Process ".\MIDI-Studio-$ver-Setup.exe" -ArgumentList '/S','/currentuser',"/D=$app" -Wait -PassThru
          if ($p.ExitCode -or (Get-Item "$app\MIDI Studio.exe").VersionInfo.ProductVersion -ne $ver) { throw 'Fresh core install failed' }
          if (!(Test-Path "$app\forge-rs.exe") -or (Test-Path "$app\assets\onnx") -or (Test-Path "$app\ort-gpu") -or (Test-Path "$store\native\ort-gpu\onnxruntime.dll")) { throw 'Unexpected fresh payload' }

  preserve-native:
    runs-on: windows-2022
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        scope: [currentuser, allusers]
    env:
      GH_REPO: ${{ github.repository }}
      INSTALL_SCOPE: ${{ matrix.scope }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Fetch pinned full installer, slim candidate and public component catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_DIGEST: ${{ inputs.sha256 }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid tag' }
          cd $env:RUNNER_TEMP
          gh release download v3.1.4 -p MIDI-Studio-3.1.4-Setup.exe
          if ($LASTEXITCODE -or (Get-FileHash MIDI-Studio-3.1.4-Setup.exe).Hash -ne '02bde64c52fe78ff8c73a0d5e26d81ade884331ed2494b497a3eb82205252e0c') { throw 'Invalid predecessor' }
          $next = 'MIDI-Studio-' + $env:RELEASE_TAG.Substring(1) + '-Setup.exe'
          gh release download $env:RELEASE_TAG -p $next
          if ($LASTEXITCODE -or (Get-FileHash $next).Hash -ne $env:NEXT_DIGEST) { throw 'Invalid candidate' }
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$env:GH_REPO/contents/tools/forge-components.json?ref=$env:RELEASE_TAG" > catalog.json
          if ($LASTEXITCODE) { throw 'Catalog fetch failed' }
      - name: Upgrade installed 3.1.4 and verify all legacy bytes are reusable offline
        shell: pwsh
        run: |
          cd $env:RUNNER_TEMP
          $app = if ($env:INSTALL_SCOPE -eq 'allusers') { "$env:ProgramFiles\MIDI Studio" } else { "$env:LOCALAPPDATA\MIDI Studio" }
          $store = "$env:RUNNER_TEMP\Forge Library"
          $reg = 'HKCU:\Software\StarsationX\MIDI Studio'
          New-Item -ItemType Directory -Path $store -Force | Out-Null
          New-Item $reg -Force | Out-Null
          New-ItemProperty $reg ForgeStorageDir -Value $store -Force | Out-Null
          function Install($exe) {
            $p = Start-Process $exe -ArgumentList '/S',"/$env:INSTALL_SCOPE","/D=$app" -Wait -PassThru
            if ($p.ExitCode) { throw "$exe failed ($($p.ExitCode))" }
          }
          Install '.\MIDI-Studio-3.1.4-Setup.exe'
          $components = @(Get-Content -Raw catalog.json | ConvertFrom-Json)
          if ($components.Count -lt 1) { throw 'Missing component catalog' }
          foreach ($c in $components) {
            if ((Get-FileHash (Join-Path $app $c.path)).Hash -ne $c.sha256) { throw "Invalid 3.1.4 fixture: $($c.path)" }
          }
          $next = $env:RELEASE_TAG.Substring(1)
          Install ".\MIDI-Studio-$next-Setup.exe"
          if ((Get-Item "$app\MIDI Studio.exe").VersionInfo.ProductVersion -ne $next) { throw 'Wrong version' }
          foreach ($c in $components) {
            $copies = @("$store\native","$env:ProgramFiles\MIDI Studio Shared Models\native") | ForEach-Object { Join-Path $_ $c.path }
            if (!($copies | Where-Object { (Test-Path -LiteralPath $_ -PathType Leaf) -and (Get-FileHash -LiteralPath $_).Hash -eq $c.sha256 })) {
              throw "Legacy component not safely preserved outside the installation: $($c.path)"
            }
          }
