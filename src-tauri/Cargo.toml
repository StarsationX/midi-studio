[package]
name = "midi-studio"
version = "3.1.4"
edition = "2021"
description = "MIDI Studio desktop host (Tauri 2). Boots the existing renderer/ and runs player-rs in-process."
license = "MIT"
default-run = "midi-studio"

# The parity CLI (tools/midi-doc-parity.js) is a dev tool: behind a feature so
# the Tauri bundler, which ships every enabled [[bin]], leaves it out.
[[bin]]
name = "midi-document"
path = "src/bin/midi-document.rs"
required-features = ["parity-cli"]

[features]
parity-cli = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["custom-protocol", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
# float_roundtrip: the default parser is best-effort and can land a float one
# ULP off; python's json is exact, and the Editor's documents (note times) come
# through the IPC as JSON, so a save would otherwise move a tick-boundary note.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
midi-player = { path = "../player-rs" }
midly = { version = "0.5", default-features = false, features = ["std"] }
trash = "5"
# updater: GitHub releases over the OS's own TLS (schannel), no C toolchain.
ureq = { version = "2.12", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
sha2 = "0.10"
url = "2"
# Forge: the installer's ForgeStorageDir value, the provisioner's embedded
# Python bootstrap, and the pipeline's line classifier.
winreg = "0.56"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
# Capture the MIDI body already delivered to MuseScore's anonymous player.
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = ["Win32_System_Com"] }
# First run after the Electron build: its per-panel localStorage is read out of
# a COPY of Chromium's leveldb (migrate.rs). Pure Rust, snappy included.
rusty-leveldb = "4"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

[dev-dependencies]
# tests/perch_focus.rs drives the running app over the WebView2 DevTools port.
tungstenite = "0.26"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_LibraryLoader",
  "Win32_Graphics_Gdi",
] }

[profile.release]
debug = false
strip = true
